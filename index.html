<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đề xuất kế hoạch tập huấn NCKH mini, NH 2026-2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--surface:#ffffff;--surface2:#f1f5f9;--ink:#0f172a;--ink2:#1e293b;--body:#1e293b;--muted:#475569;--faint:#64748b;--line:#e2e8f0;
  --pri:#4f46e5;--pri-d:#3730a3;--pri-50:#eef2ff;--pri-100:#e0e7ff;--pri-200:#c7d2fe;--pri-ink:#312e81;
  --ok:#059669;--ok-100:#d1fae5;--ok-200:#a7f3d0;--ok-ink:#065f46;
  --A:#1d4ed8;--As:#eff6ff;--B:#6d28d9;--Bs:#f5f3ff;--C:#c2410c;--Cs:#fff7ed;--D:#047857;--Ds:#ecfdf5;--E:#be123c;--Es:#fff1f2;--F:#475569;--Fs:#f1f5f9;
  --l0:#f8fafc;--l1:#ecfdf5;--l2:#d1fae5;--l3:#059669;--l3ink:#ffffff;
  --warn:#92400e;--warn-bg:#fffbeb;--warn-line:#fde68a;
  --sticky:rgba(255,255,255,.96);--shadow:0 1px 2px 0 rgba(15,23,42,.05);--shadow2:0 1px 3px 0 rgba(15,23,42,.1),0 1px 2px -1px rgba(15,23,42,.1);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
button{font:inherit}

.shell{padding:16px 12px}
@media (min-width:640px){.shell{padding:24px}}
@media (min-width:1024px){.shell{padding:24px 40px}}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--sticky);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);box-shadow:var(--shadow);margin:-16px -12px 16px;padding:12px 12px 12px}
@media (min-width:640px){.sticky{margin:-24px -24px 16px;padding:14px 24px 12px}}
@media (min-width:1024px){.sticky{margin:-24px -40px 20px;padding-left:40px;padding-right:40px}}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand{margin:0;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--pri)}
.top h1{margin:0;font-size:1.125rem;line-height:1.35;font-weight:800;color:var(--ink)}
@media (min-width:640px){.top h1{font-size:1.25rem}}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.count{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:.75rem;font-weight:700;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.count.p{border-color:var(--pri-200);background:var(--pri-50);color:var(--pri-d)}
@media (max-width:640px){.count{padding:5px 8px;font-size:.7rem}.top-r{gap:4px}}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:8px}
.progress div{height:100%;background:var(--pri);border-radius:999px;transition:width .4s ease}
.pills{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.pill{flex:none;appearance:none;border:0;font-size:.75rem;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;background:var(--ok-100);color:var(--ok-ink);transition:background-color .15s}
.pill:hover{background:var(--ok-200)}
.pill[aria-selected="true"]{background:var(--pri);color:#fff;box-shadow:var(--shadow2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
@media (min-width:640px){.card{padding:32px}}
.foot{text-align:center;font-size:.75rem;color:var(--faint);padding-top:8px;border-top:1px solid var(--line)}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#gate[hidden]{display:none}
.gate-card{width:100%;max-width:420px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow2);padding:28px}
.gate-card .brand{margin:0 0 6px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--pri)}
.gate-card h2{margin:0 0 8px;font-size:1.2rem;line-height:1.35;color:var(--pri-d)}
.gate-card p{margin:0 0 6px;color:var(--muted);font-size:.9rem}
.gate-card form{display:flex;gap:8px;margin-top:16px}
.gate-card input{flex:1;min-width:0;font:inherit;font-size:.95rem;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.gate-card input:focus{border-color:var(--pri);outline:none}
.gate-card button[type=submit]{appearance:none;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:.9rem;padding:10px 18px;border-radius:8px;cursor:pointer;white-space:nowrap}
.gate-card .gate-err{color:var(--E);font-weight:600;font-size:.85rem;margin:12px 0 0;min-height:1.2em}
.gate-card .lang{margin-top:18px}
@media (prefers-reduced-motion:no-preference){.fade-in{animation:fadeIn .35s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
section[role=tabpanel][hidden]{display:none}

.s-head{margin-bottom:16px}
.s-head .meta{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.s-head h2{margin:0;font-size:1.25rem;line-height:1.35;font-weight:700;color:var(--pri-d)}
.goal{background:var(--pri-50);border:1px solid var(--pri-100);border-radius:12px;padding:16px;margin:0 0 20px;font-size:.875rem;color:var(--pri-ink)}
.goal b{color:var(--pri-d)}
.goal p{color:var(--pri-ink);margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin-bottom:20px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{flex:none;appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--body);font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{border-color:var(--pri-200);color:var(--pri)}
.tabs button[aria-selected="true"]{background:var(--pri-50);border-color:var(--pri-200);color:var(--pri-d)}
h3{font-size:1.05rem;font-weight:700;color:var(--ink2);margin:24px 0 10px}
.sub>h3:first-child{margin-top:0}
h4{font-size:.95rem;font-weight:700;color:var(--ink2);margin:16px 0 6px}
p{margin:0 0 10px;color:var(--body);font-size:.9rem}
.note{color:var(--muted);font-size:.85rem}
ul,ol{padding-left:1.25em;margin:0 0 10px;color:var(--body);font-size:.9rem}
li{margin:3px 0}
.tbl{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.85rem;color:var(--body)}
th,td{padding:10px 12px;vertical-align:top;text-align:left;border:1px solid var(--line)}
tr>:first-child{border-left:0} tr>:last-child{border-right:0}
thead tr:first-child>*{border-top:0} tbody tr:last-child>*{border-bottom:0}
th{background:var(--surface2);font-weight:700;color:var(--ink2)}
td.k{font-weight:600;white-space:nowrap;color:var(--ink2)}
.notebox{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:.875rem;color:var(--warn)}
.toolbar{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap;align-items:center}
.toolbar .lab{font-size:.75rem;font-weight:600;color:var(--muted);margin-right:2px}
.toolbar button{appearance:none;font-size:.75rem;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--body);padding:5px 12px;border-radius:8px;cursor:pointer}
.toolbar button:hover{border-color:var(--pri-200);color:var(--pri)}
.toolbar button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.toolbar .gap{width:12px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 8px;margin:0 4px 4px 0;font-size:.8rem;background:var(--surface2);color:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.legend span{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--body)}

/* domain tag (like .kn) */
.kn{display:inline-block;font-weight:700;font-size:.78em;padding:1px 7px;border-radius:6px;white-space:nowrap;color:var(--kc);background:var(--ks)}
.kn.sup{background:transparent;box-shadow:inset 0 0 0 1.5px var(--kc)}
[data-d="A"]{--kc:var(--A);--ks:var(--As)}[data-d="B"]{--kc:var(--B);--ks:var(--Bs)}[data-d="C"]{--kc:var(--C);--ks:var(--Cs)}
[data-d="D"]{--kc:var(--D);--ks:var(--Ds)}[data-d="E"]{--kc:var(--E);--ks:var(--Es)}[data-d="F"]{--kc:var(--F);--ks:var(--Fs)}

/* skill card */
.skill{border:1px solid var(--line);border-left:4px solid var(--kc,var(--pri));border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:16px 20px;margin-bottom:16px}
.skill h3{margin:0 0 10px;color:var(--kc,var(--pri-d));font-size:1rem}
.skill dl{display:grid;grid-template-columns:170px 1fr;gap:10px 16px;margin:0;font-size:.9rem}
.skill dt{font-weight:600;color:var(--muted);font-size:.85rem}
.skill dd{margin:0;color:var(--body)}
.skill dd p{margin:0 0 4px}
.skill dd ul{margin:2px 0 0}
.skill dd .vi{color:var(--muted)}
.skill dd.tgt{background:var(--ks,var(--pri-50));border-radius:8px;padding:6px 10px;margin:-6px 0}
.linkbtn{appearance:none;background:none;border:0;padding:8px 0 0;color:var(--pri);font-weight:600;font-size:.8rem;cursor:pointer}
@media (max-width:640px){.skill dl{grid-template-columns:1fr;gap:2px}.skill dd{margin-bottom:10px}.skill dd.tgt{margin:0 0 10px}}
.gen{display:grid;grid-template-columns:170px 1fr;gap:10px 16px;background:var(--pri-50);border:1px solid var(--pri-100);border-radius:12px;padding:16px;margin:0 0 20px;font-size:.875rem}
.gen dt{font-weight:700;color:var(--pri-d)}
.gen dd{margin:0;color:var(--pri-ink)}
@media (max-width:640px){.gen{grid-template-columns:1fr;gap:2px}.gen dd{margin-bottom:8px}}

/* indicator with 4-level ladder */
.ind{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.ind header{padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-bottom:1px solid var(--line)}
.ind header h4{margin:0;font-size:.95rem}
.ind header .forms{font-size:.85rem;color:var(--body);flex-basis:100%;margin:4px 0 0}
.ind .meta{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.ind .meta div{padding:10px 16px;font-size:.83rem;color:var(--body)}
.ind .meta div+div{border-left:1px solid var(--line)}
.ind .meta b{display:block;font-size:.75rem;color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;padding:0;margin:0}
.ladder li{margin:0;border-right:1px solid var(--line)}
.ladder li:last-child{border-right:0}
.ladder button{appearance:none;display:flex;flex-direction:column;justify-content:flex-start;width:100%;height:100%;text-align:left;border:0;padding:12px 14px;font-size:.85rem;color:var(--body);cursor:pointer;background:transparent}
.ladder button b{display:block;font-size:.75rem;margin-bottom:4px;color:var(--ink2)}
.ladder li[data-l="0"]{background:var(--l0)}.ladder li[data-l="1"]{background:var(--l1)}.ladder li[data-l="2"]{background:var(--l2)}
.ladder li[data-l="3"]{background:var(--l3)}.ladder li[data-l="3"] button,.ladder li[data-l="3"] button b{color:var(--l3ink)}
.ladder button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--pri)}
.ladder button[aria-pressed="true"] b::after{content:"  ✓ selected";font-weight:700}
@media (max-width:760px){.ladder{grid-template-columns:1fr}.ladder li{border-right:0;border-bottom:1px solid var(--line)}.ladder li:last-child{border-bottom:0}.ind .meta{grid-template-columns:1fr}.ind .meta div+div{border-left:0;border-top:1px solid var(--line)}}
.summary{position:sticky;bottom:0;z-index:5;background:var(--sticky);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow2);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));margin-top:8px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.summary .lb{font-size:.7rem;font-weight:600;color:var(--muted)}
.summary .dec{font-size:1.05rem;font-weight:800;color:var(--pri-d)}
.summary .sc{display:flex;gap:4px}
.summary .sc span{min-width:30px;height:26px;padding:0 4px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;background:var(--surface2);color:var(--faint)}
.summary .val{font-size:.85rem;font-weight:600;color:var(--body)}
.summary .reset{margin-left:auto;appearance:none;font-size:.75rem;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--body);padding:5px 12px;border-radius:8px;cursor:pointer}

/* list items (toc style) */
.toc-list{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:10px}
.toc-list li{margin:0}
.toc-item{display:grid;grid-template-columns:40px 110px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
.toc-item.two{grid-template-columns:40px 1fr}
.toc-item .n{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--pri-50);color:var(--pri)}
.toc-item .w{font-weight:700;font-size:.8rem;color:var(--pri);padding-top:7px}
.toc-item .c b{display:block;font-size:.95rem;font-weight:700;color:var(--ink2);margin-bottom:2px}
.toc-item .c p{margin:0;color:var(--muted);font-size:.85rem}
.toc-item.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.toc-item.warn .n{background:var(--warn-line);color:var(--warn)}
@media (max-width:640px){.toc-item{grid-template-columns:36px 1fr;gap:4px 12px}.toc-item .c{grid-column:1 / -1}}

/* option cards */
.tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:16px}
.tm{border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:16px}
.tm.rec{border-left-color:var(--pri);background:var(--pri-50);border-color:var(--pri-200)}
.tm h4{margin:0 0 6px;font-size:1rem;display:flex;gap:8px;align-items:center;justify-content:space-between}
.tag{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--pri);color:#fff}
.tm dl{margin:0;font-size:.85rem}
.tm dt{color:var(--muted);font-size:.75rem;font-weight:600;margin-top:8px}
.tm dd{margin:0;color:var(--body)}
.tm ul{margin:2px 0 0;font-size:.85rem}
.pro li::marker{content:"+  ";color:var(--ok);font-weight:700}
.con li::marker{content:"–  ";color:var(--E);font-weight:700}

/* timeline */
.bar{display:flex;min-height:44px;border-radius:999px;overflow:hidden;margin:6px 0 4px;gap:2px;background:var(--line)}
.bar button{appearance:none;border:0;display:flex;flex-direction:column;justify-content:center;padding:4px 12px;font-size:.72rem;font-weight:700;color:var(--kc);background:var(--ks);text-align:left;cursor:pointer;line-height:1.2;min-width:0;overflow:hidden}
.bar button span{font-weight:500;opacity:.85}
.bar button[aria-pressed="true"]{background:var(--kc);color:#fff}
.ticks{position:relative;height:28px;margin-bottom:12px}
.ticks i{position:absolute;top:0;transform:translateX(-50%);font-style:normal;font-size:.68rem;font-weight:600;color:var(--pri);display:flex;flex-direction:column;align-items:center}
.ticks i::before{content:"";width:2px;height:8px;background:var(--pri);margin-bottom:1px;border-radius:2px}
@media (max-width:760px){.bar{flex-direction:column;border-radius:12px}.bar button{flex:none!important;padding:8px 12px;font-size:.8rem}.ticks{display:none}}
.pillv{display:inline-block;min-width:28px;text-align:center;padding:1px 8px;border-radius:999px;background:var(--pri);color:#fff;font-weight:700}
.dash{color:var(--faint)}

.lang{display:inline-flex;border:2px solid var(--pri-200);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{appearance:none;border:0;background:transparent;color:var(--pri-d);font-size:.75rem;font-weight:700;padding:4px 10px;cursor:pointer}
.lang button+button{border-left:2px solid var(--pri-200)}
.lang button[aria-pressed="true"]{background:var(--pri);color:#fff}
@media (max-width:640px){.lang button{padding:3px 8px;font-size:.7rem}}
table.opt th.rec,table.opt td.rec{background:var(--pri-50)}
table.opt th.rec{color:var(--pri-d)}
table.opt tbody th{white-space:normal;background:var(--surface2)}
table.opt{table-layout:fixed}
table.opt td ul{margin:0;font-size:.85rem}
table.std{table-layout:fixed;min-width:980px}
table.std th:first-child,table.std td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);width:160px;box-shadow:1px 0 0 var(--line)}
table.std thead th:first-child{background:var(--surface2)}
table.std th.tgt{background:var(--pri-100);color:var(--pri-d)}
table.std td.tgt{background:var(--pri-50)}
table.std td:first-child b{display:block;color:var(--kc)}
table.std th small{display:block;font-weight:600;color:var(--pri)}
@media (max-width:640px){table.std th:first-child,table.std td:first-child{width:130px}}
.ladder li{padding:12px 14px;font-size:.85rem;color:var(--body)}
.ladder li b{display:block;font-size:.75rem;margin-bottom:4px;color:var(--ink2)}
.ladder li[data-l="3"] b{color:var(--l3ink)}
.tabs.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}
.tabs.dgrid button{white-space:normal;text-align:left;align-items:flex-start;line-height:1.35}
.tabs.dgrid button .kn{margin-top:1px}
@media (max-width:640px){.tabs.dgrid{gap:4px}.tabs.dgrid button{flex-direction:column;gap:4px;padding:6px 8px;font-size:.72rem}}

:root{--t0:#eef2ff;--t1:#e0e7ff;--t2:#c7d2fe;--t3:#818cf8;--t4:#4f46e5}
.ladder.t5{grid-template-columns:repeat(5,1fr)}
.ladder li[data-t="0"]{background:var(--t0)}.ladder li[data-t="1"]{background:var(--t1)}.ladder li[data-t="2"]{background:var(--t2)}
.ladder li[data-t="3"]{background:var(--t3);color:#fff}.ladder li[data-t="4"]{background:var(--t4);color:#fff}
.ladder li[data-t="3"] b,.ladder li[data-t="4"] b,.ladder li[data-t="3"] .gr,.ladder li[data-t="4"] .gr{color:#fff}
.ladder .gr{display:block;width:fit-content;font-size:.7rem;font-weight:700;color:var(--pri);margin-bottom:4px}
.ladder li[data-t="3"] .gr,.ladder li[data-t="4"] .gr{background:rgba(255,255,255,.2);padding:0 6px;border-radius:6px}
@media (max-width:760px){.ladder.t5{grid-template-columns:1fr}}
.fig3d{margin:0;overflow-x:auto}
.fig3d svg{display:block;width:100%;max-width:760px;min-width:480px;height:auto;margin:0 auto;font-family:var(--sans)}
.ladder li[data-l="3"]{color:var(--l3ink)}

.stages{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.stage{appearance:none;text-align:left;border:2px solid var(--line);border-top:5px solid var(--kc);border-radius:12px;background:var(--surface);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;font:inherit;color:inherit}
.stage:hover{border-color:var(--kc);border-top-width:5px}
.stage .sn{font-size:.7rem;font-weight:700;color:var(--kc)}
.stage .st{font-size:.85rem;font-weight:700;color:var(--ink2);line-height:1.3;overflow-wrap:anywhere}
.stage .sw{font-size:.75rem;font-weight:600;color:var(--muted)}

.hbtn:hover{background:var(--pri);border-color:var(--pri);color:#fff}

.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin:0 0 20px}

.doc:hover{background:var(--pri);border-color:var(--pri);color:#fff}
@media (max-width:640px){.doc{padding:5px 8px;font-size:.7rem}.docs{gap:4px;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}}

table.tlt tr.ms>td{background:var(--pri-50)}
table.tlt tr.ms td:nth-child(2){font-weight:600;color:var(--pri-ink)}

 {w:'6/2027',a:['Report outcomes to BOP.','Báo cáo kết quả lên LĐNT.'],h:'CIEC'}];

const PLAN2=[
 {w:['11/2026','11/2026'],a:['Finalise the design and build the system on AI+: set up the managing agent and the specialised sub-agents (system prompts, one shared record for each research project, quality gates between stages) and prepare the starting reference library.','Chốt thiết kế và xây dựng hệ thống trên nền tảng AI+: thiết lập agent tổng quản lý và các agent con chuyên biệt (câu lệnh hệ thống, hồ sơ dùng chung cho từng dự án nghiên cứu, các cổng chất lượng giữa các giai đoạn) và chuẩn bị kho tài liệu tham khảo khởi điểm.'],h:'CIEC',
  n:[['Output: the chatbot system runs on AI+ in a first internal version.','Sản phẩm: hệ chatbot vận hành trên AI+ ở phiên bản nội bộ đầu tiên.']]},
 {w:['12/2026','12/2026'],a:['Internal testing with a set of test cases: run each sub-agent on sample tasks at every stage of the research process, including safety cases (fabricated citations, identifiable student data, the ethics gate); revise the prompts from the results.','Kiểm thử nội bộ bằng bộ ca kiểm tra: chạy từng agent con trên các nhiệm vụ mẫu ở mọi giai đoạn của quy trình nghiên cứu, kể cả các ca an toàn (trích dẫn bịa, dữ liệu định danh học sinh, cổng đạo đức); chỉnh sửa câu lệnh theo kết quả.'],h:'CIEC',
  n:[['Safety cases must pass in full before the system is opened to teachers.','Các ca an toàn phải đạt toàn bộ trước khi mở hệ thống cho giáo viên.']]},
 {w:['1/2027','1/2027'],a:['Expert appraisal of the quality of the agents\u2019 outputs and of the safeguards; adjust the system following the appraisal results.','Thẩm định chuyên gia về chất lượng đầu ra của các agent và về các biện pháp bảo vệ; điều chỉnh hệ thống theo kết quả thẩm định.'],h:['CIEC, experts','CIEC, chuyên gia']},
 {w:['2/2027','2/2027'],a:['Pilot with the first group of teachers, in parallel with the Solution 1 workshop series: teachers use the chatbot system on their own research projects; collect feedback on usefulness and output quality.','Thí điểm với nhóm giáo viên đầu tiên, song song với chuỗi tập huấn của Giải pháp 1: giáo viên dùng hệ chatbot trên dự án nghiên cứu của mình; thu thập phản hồi về mức độ hữu ích và chất lượng đầu ra.'],h:'CIEC',
  n:[['The pilot group is the teachers taking part in the workshop series who volunteer for the pilot.','Nhóm thí điểm là các giáo viên tham gia chuỗi tập huấn và tự nguyện tham gia thí điểm.']]},
 {w:['3–4/2027','3–4/2027'],a:['Refine the system from the pilot feedback, then open it to all participating teachers; support its use during the data collection and data analysis stages of their projects.','Hoàn thiện hệ thống theo phản hồi thí điểm, rồi mở cho toàn bộ giáo viên tham gia; hỗ trợ sử dụng trong giai đoạn thu thập và phân tích dữ liệu của các dự án.'],h:'CIEC'},
 {w:['5/2027','5/2027'],a:['Evaluate the effectiveness after one semester of use: level of use, output quality, time saved and teacher feedback; summarise the results and propose the plan for the following school year.','Đánh giá hiệu quả sau một học kỳ sử dụng: mức độ sử dụng, chất lượng đầu ra, thời gian tiết kiệm và phản hồi của giáo viên; tổng kết kết quả và đề xuất kế hoạch cho năm học tiếp theo.'],h:'CIEC'}];

/* ---------- render ---------- */
const head=(meta,h2)=>`<div class="s-head"><div><span class="meta">${meta}</span><h2>${h2}</h2></div></div>`;
const solChip=n=>{const s=SOL.find(x=>x.n===n);if(!s)return '';return `<span class="kn" data-d="${s.d}" style="white-space:normal">${T('Solution','Giải pháp')} ${n}: ${L(s.t)}</span>`};

function renderOv(){
 $('#p-ov').innerHTML=head(T('Proposal for BOP approval','Đề xuất trình LĐNT phê duyệt'),T('SR mini workshops for teachers, AY 2026-2027','Tập huấn NCKH mini cho giáo viên, NH 2026-2027'))+
 `<h3>${T('What the previous reports show','Báo cáo các năm trước cho thấy')}</h3>
 <div class="stat">${STATS.map(x=>{const so=SOL[(x.n-1)%SOL.length];return `<div data-d="${so.d}"><b>${VI()?x.v.replace(/\./g,','):x.v}</b><span>${L(x.l)}</span><em>${L(x.x)}</em></div>`}).join('')}</div>
 <div class="notebox">${T('Constraint for AY 2026-2027: teachers carry heavy workloads and unplanned duties during the year, so few can attend every session in person.','Ràng buộc NH 2026-2027: giáo viên có khối lượng công việc lớn và công tác đột xuất trong năm, nên ít người dự được trọn vẹn tất cả các buổi trực tiếp.')}</div>
 <div class="goal"><p><b>${T('Main idea:','Ý tưởng chính:')}</b> ${T('one common theme, "AI in educational research", following the research process — teachers use AI responsibly at each stage of their own research, practise in session and are supported individually between sessions, and finish with shareable outputs: proposals, research instruments, support chatbots or apps, reports and papers.','một chủ đề chung "AI trong nghiên cứu giáo dục", đi theo tiến trình nghiên cứu — giáo viên khai thác AI có trách nhiệm ở từng giai đoạn của dự án của mình, thực hành trong buổi và được hỗ trợ cá nhân giữa các buổi, và kết thúc bằng sản phẩm có thể lan tỏa: đề cương, công cụ nghiên cứu, chatbot hoặc ứng dụng hỗ trợ, báo cáo và bài báo.')}</p></div>
 <h3>${T('Purposes','Mục đích')}</h3><ol>${PURPOSE.map(p=>`<li>${L(p)}</li>`).join('')}</ol>`;}

function renderSol(){
 $('#p-sol').innerHTML=head(T('Current solutions','Giải pháp hiện tại'),T('Training in AI for research, plus an AI+ chatbot system','Tập huấn ứng dụng AI trong nghiên cứu và hệ chatbot AI+'))+
 `<div class="tbl"><table class="opt soltbl"><colgroup><col style="width:18%"><col style="width:38%"><col style="width:24%"><col style="width:20%"></colgroup>
 <thead><tr><th>${T('Solution','Giải pháp')}</th><th>${T('Content','Nội dung')}</th><th>${T('Objective','Mục tiêu')}</th><th>${T('Safeguard','Lưu ý')}</th></tr></thead><tbody>
 ${SOL.map(s=>`<tr data-d="${s.d}"><th scope="row"><span class="kn" data-d="${s.d}">${T('Solution','Giải pháp')} ${s.n}</span><b>${L(s.t)}</b></th><td><ul>${s.how.map(x=>`<li>${L(x)}</li>`).join('')}</ul></td><td>${L(s.fix)}</td><td class="tgt">${L(s.risk)}</td></tr>`).join('')}
 </tbody></table></div>`;}

function renderCmp(){
 $('#p-cmp').innerHTML=head(T('AY 2025-2026 compared with AY 2026-2027','So sánh NH 2025-2026 và NH 2026-2027'),T('What changes and why','Thay đổi gì và vì sao'))+
 `<div class="tbl"><table class="opt"><colgroup><col style="width:20%"><col style="width:22%"><col style="width:30%"><col style="width:28%"></colgroup>
 <thead><tr><th>${T('Area','Nội dung')}</th><th>2025-2026</th><th class="rec">2026-2027</th><th>${T('Reason','Lý do')}</th></tr></thead><tbody>
 ${CMP.map(r=>`<tr><th scope="row">${L(r[0])}${r[4]?`<br>${solChip(r[4])}`:''}</th><td>${L(r[1])}</td><td class="rec">${L(r[2])}</td><td>${L(r[3])}</td></tr>`).join('')}
 </tbody></table></div>`;}

let curSubPlan='s1';
function planTable(rows){return `<div class="tbl"><table class="opt tlt"><colgroup><col style="width:16%"><col style="width:40%"><col style="width:12%"><col style="width:32%"></colgroup>
 <thead><tr><th>${T('Date','Ngày')}</th><th>${T('Activity','Hoạt động')}</th><th>${T('Host','Phòng ban phụ trách')}</th><th>${T('Note','Ghi chú')}</th></tr></thead><tbody>
 ${rows.map(x=>`<tr><td class="k">${L(x.w)}</td><td>${L(x.a)}</td><td>${L(x.h)}</td><td>${(x.n||[]).map(v=>`<p style="margin:0 0 6px;font-size:inherit">${L(v)}</p>`).join('')}</td></tr>`).join('')}
 </tbody></table></div>`}
function renderPlan(){
 const sol1=T('Solution 1 — Workshop series','Giải pháp 1 — Chuỗi tập huấn'), sol2=T('Solution 2 — AI+ chatbot system','Giải pháp 2 — Hệ chatbot AI+');
 $('#p-plan').innerHTML=head(T('One schedule for each solution','Mỗi giải pháp một kế hoạch'),T('Planned schedule','Kế hoạch dự kiến'))+
 `<div class="tabs" role="tablist" aria-label="${T('Solutions','Giải pháp')}">
   <button role="tab" data-sub="s1" aria-selected="${curSubPlan==='s1'}">${sol1}</button>
   <button role="tab" data-sub="s2" aria-selected="${curSubPlan==='s2'}">${sol2}</button>
 </div>
 <div data-pane="s1" ${curSubPlan==='s1'?'':'hidden'}>${planTable(PLAN1)}</div>
 <div data-pane="s2" ${curSubPlan==='s2'?'':'hidden'}>${planTable(PLAN2)}
 <div class="notebox">${T('The Solution 2 schedule is a proposal drafted for this plan (November 2026 to May 2027), following the build, testing, expert appraisal, pilot and evaluation stages of the AI+ agent-set design; it is not taken from the plan document.','Kế hoạch của Giải pháp 2 là bản đề xuất soạn cho kế hoạch này (tháng 11/2026 đến tháng 5/2027), theo các giai đoạn xây dựng, kiểm thử, thẩm định chuyên gia, thí điểm và đánh giá của bản thiết kế bộ agent AI+; nội dung này không lấy từ văn bản kế hoạch.')}</div></div>`;
 document.querySelectorAll('#p-plan [data-sub]').forEach(b=>{b.onclick=()=>{curSubPlan=b.dataset.sub;renderPlan();};});
}

/* ---------- shell ---------- */
const IDS=['ov','sol','cmp','plan'];
const tabs=[...document.querySelectorAll('[role=tab].pill')];
let curTab=null;
function openTab(id,focus){curTab=id;const pid='p-'+id;tabs.forEach((t,i)=>{const on=t.getAttribute('aria-controls')===pid;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;const p=document.getElementById(t.getAttribute('aria-controls'));p.hidden=!on;if(on){p.classList.remove('fade-in');void p.offsetWidth;p.classList.add('fade-in');$('#count').textContent=`${T(...UI.section)} ${i+1} / ${tabs.length}`;$('#prog').style.width=((i+1)/tabs.length*100)+'%';if(focus)t.focus()}});try{if(location.hash!=='#'+id)history.replaceState(null,'','#'+id)}catch(e){}}
tabs.forEach((t,i)=>{t.onclick=()=>{openTab(t.getAttribute('aria-controls').slice(2));window.scrollTo({top:0})};t.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];openTab(n.getAttribute('aria-controls').slice(2),true)}}});
function applyGate(){const g=document.querySelector('#gate');if(g)g.hidden=unlocked;}
function renderAll(){document.documentElement.lang=VI()?'vi':'en';
 $('.top h1').textContent=T(...UI.title);$('#foot').textContent=UI.foot;document.title=T(...UI.title);
 $('#docs').innerHTML=DOCS.map(d=>`<a class="doc" href="${esc(d.u)}" target="_blank" rel="noopener">${L(d.t)}</a>`).join('');
 const gt=document.querySelector('#gate-title');if(gt){gt.textContent=T('Protected content','Nội dung được bảo vệ');document.querySelector('#gate-desc').textContent=T('Enter the password to view the content of the tabs.','Nhập mật khẩu để xem nội dung các tab.');document.querySelector('#gate-btn').textContent=T('Unlock','Mở khóa');document.querySelector('#gate-pw').placeholder=T('Password','Mật khẩu');}
 applyGate();
 tabs.forEach(t=>{t.textContent=T(...UI.tabs[t.getAttribute('aria-controls').slice(2)])});
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
 renderOv();renderSol();renderCmp();renderPlan();
 if(curTab)openTab(curTab);}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;renderAll()});
renderAll();
const gf=document.querySelector('#gate-form');
if(gf)gf.onsubmit=e=>{e.preventDefault();const v=document.querySelector('#gate-pw').value;if(v===GATE_PW){unlocked=true;try{sessionStorage.setItem('srmw-open','1')}catch(e2){}document.querySelector('#gate-err').textContent='';applyGate();window.scrollTo({top:0});}else{document.querySelector('#gate-err').textContent=T('Incorrect password. Please try again.','Mật khẩu chưa đúng. Vui lòng thử lại.');document.querySelector('#gate-pw').select();}};
applyGate();
const start=(location.hash||'').slice(1);openTab(IDS.includes(start)?start:'ov');
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(IDS.includes(h)&&h!==curTab){openTab(h);window.scrollTo(0,0)}});

</script>
</body>
</html>
